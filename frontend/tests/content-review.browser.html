<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>内容审查浏览器回归测试</title></head>
<body>
<pre id="result">RUNNING</pre><div id="app"></div>
<script type="module">
import { createApp, h, reactive, nextTick } from "vue";
import ElementPlus from "element-plus";
import "element-plus/dist/index.css";
import JSZip from "jszip";
import ContentReviewPanel from "/src/components/ContentReviewPanel.vue";
import DocPreview from "/src/components/DocPreview.vue";
import http from "/src/api/http.ts";

// 仅测试使用的合成文档与模拟响应，不读取用户文档或调用模型。
const zip = new JSZip();
zip.file("[Content_Types].xml", '<?xml version="1.0"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/header1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.header+xml"/></Types>');
zip.file("_rels/.rels", '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
zip.file("word/_rels/document.xml.rels", '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdHeader" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/header" Target="header1.xml"/></Relationships>');
zip.file("word/header1.xml", '<w:hdr xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:p><w:r><w:t>页眉段落</w:t></w:r></w:p></w:hdr>');
const anchor = (name, id) => '<w:bookmarkStart w:id="' + id + '" w:name="' + name + '"/><w:bookmarkEnd w:id="' + id + '"/>';
zip.file("word/document.xml", '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><w:body><w:p>' + anchor("sf_content_0", 0) + anchor("sf_format_0", 1) + '<w:r><w:t>相同文字</w:t></w:r></w:p><w:tbl><w:tblPr/><w:tblGrid><w:gridCol w:w="6000"/></w:tblGrid><w:tr><w:tc><w:tcPr/><w:p>' + anchor("sf_content_1", 2) + '<w:r><w:t>销售额为200万元。</w:t></w:r></w:p></w:tc></w:tr></w:tbl><w:p>' + anchor("sf_content_2", 3) + anchor("sf_format_1", 4) + '<w:r><w:t>相同文字</w:t></w:r></w:p><w:sectPr><w:headerReference w:type="default" r:id="rIdHeader"/><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1440" w:bottom="1440" w:left="1440" w:right="1440" w:header="720" w:footer="720"/></w:sectPr></w:body></w:document>');

const blob = await zip.generateAsync({ type: "blob" });
const review = {
  id: 1, workspace_id: 1, document_id: 1, instructions: "", model: "mock",
  paragraph_count: 3, created_at: "2026-10-15T00:00:00", summary: "存在金额矛盾",
  issues: [{ paragraph_index: 1, quote: "销售额为200万元。", category: "一致性",
    severity: "重要", reason: "与其他段落矛盾", suggestion: "核实金额并统一表述。" }],
};
let saved = [];
let previewDelay = 60;
http.defaults.adapter = async config => {
  let data;
  if (config.url.endsWith("/preview")) {
    await new Promise(resolve => setTimeout(resolve, previewDelay)); data = blob;
  } else if (config.method === "post") { saved = [review]; data = review; }
  else { data = saved; }
  return { data, status: 200, statusText: "OK", headers: {}, config };
};
const state = reactive({ tab: "content", index: null, kind: "content", docId: 1 });
async function locate(documentId, index) {
  state.index = null; state.docId = documentId; state.kind = "content"; state.tab = "preview";
  await nextTick(); state.index = index;
}
const app = createApp({
  render: () => h("main", { style: "max-width:1100px;margin:auto" }, [
    h("div", { style: { display: state.tab === "content" ? "block" : "none" } }, [
      h(ContentReviewPanel, { workspaceId: 1, document: { id: state.docId, filename: "测试.docx" }, acceptedFixes: [], onLocate: locate }),
    ]),
    h("div", { style: { display: state.tab === "preview" ? "block" : "none" } }, [
      h(DocPreview, { documentId: state.docId, focusParagraph: state.index, focusKind: state.kind, active: state.tab === "preview" }),
    ]),
  ]),
}).use(ElementPlus);
app.mount("#app");
const wait = async condition => {
  for (let i = 0; i < 300; i++) {
    if (condition()) return;
    await new Promise(resolve => setTimeout(resolve, 30));
  }
  throw new Error("等待界面状态超时");
};
function assert(ok, message) { if (!ok) throw new Error(message); }
let scrolls = 0;
const originalScroll = Element.prototype.scrollIntoView;
Element.prototype.scrollIntoView = function(...args) { scrolls++; originalScroll.apply(this, args); };
try {
  const runButton = () => [...document.querySelectorAll(".content-review header button")].find(button => button.textContent.includes("用 DeepSeek 审查内容"));
  await wait(() => runButton() && !runButton().disabled);
  runButton().click();
  await wait(() => document.querySelector(".issue .quote"));
  document.querySelector(".issue .quote").click();
  await wait(() => document.querySelector(".is-focused"));
  assert(document.querySelector(".is-focused").closest("td"), "表格建议必须定位表格段落");
  assert(document.querySelector(".is-focused").textContent === review.issues[0].quote, "定位原文不匹配");
  await wait(() => scrolls > 0);
  const before = scrolls;
  state.tab = "content"; await nextTick();
  document.querySelector(".issue .quote").click();
  await wait(() => scrolls > before);
  state.index = null; await nextTick();
  state.kind = "format"; state.index = 1;
  await wait(() => document.querySelector(".is-focused")?.querySelector('[id="sf_format_1"]'));
  assert(!document.querySelector(".is-focused").closest("td"), "格式段落不应被表格/页眉干扰");
  assert(document.querySelector(".is-focused").querySelector('[id="sf_content_2"]'), "重复文字应定位第二段");
  // 切换文档且渲染尚未完成时发出定位。
  previewDelay = 200;
  state.docId = 2; state.kind = "content"; state.index = 1;
  await wait(() => document.querySelector(".is-focused")?.closest("td"));
  document.querySelector("#result").textContent = "PASS: 内容审查、表格原文、重复点击、格式编号、延迟渲染定位";
} catch (error) {
  document.querySelector("#result").textContent = "FAIL: " + error.stack;
}
</script>
</body>
</html>
